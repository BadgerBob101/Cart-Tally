<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142c28"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Cart Tally"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Cart Tally</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#18332e;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}main{max-width:550px;margin:auto;padding:24px 18px 60px}h1{margin:4px 0 18px;font-size:30px}.summary{background:#173e35;color:white;padding:20px;border-radius:22px}.summary small{opacity:.8}.total{font-size:42px;font-weight:750;margin:3px 0 14px}.twocol{display:flex;justify-content:space-between;gap:10px}.panel{background:white;border-radius:18px;padding:16px;margin-top:16px;box-shadow:0 3px 16px #173e3510}label{display:block;font-size:14px;font-weight:650;margin-bottom:6px}input{font:inherit;width:100%;padding:14px;border:1px solid #bdcbc5;border-radius:12px;min-width:0}input:focus{outline:2px solid #2b876b}.fields{display:grid;grid-template-columns:1fr 110px;gap:12px}.entry{display:flex;gap:8px}.entry input{flex:1}.btn{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:#25745c;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#e6efea;color:#245747}.btn.danger{background:#f9e9e5;color:#9a3425}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e6ebe7}.item:last-child{border:0}.muted{color:#64756e;font-size:13px}.remove{background:none;border:0;font-size:22px;color:#8a4b43;padding:5px 10px}.head{display:flex;justify-content:space-between;align-items:center}button:active{transform:scale(.98)}</style></head><body><main><h1>🛒 Cart Tally</h1><section class="summary"><small>Estimated checkout total</small><div class="total" id="total">$0.00</div><div class="twocol"><span>Subtotal <b id="subtotal">$0.00</b></span><span>Tax <b id="taxAmount">$0.00</b></span></div></section><section class="panel"><div class="fields"><div><label for="budget">Budget (optional)</label><input id="budget" type="number" min="0" step="0.01" placeholder="e.g. 100"></div><div><label for="rate">Sales tax %</label><input id="rate" type="number" min="0" max="100" step="0.01" value="7"></div></div><p id="remaining" class="muted"></p></section><section class="panel"><form id="addForm"><label for="price">Add an item price</label><div class="entry"><input id="price" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required><button class="btn" type="submit">+ Add</button></div></form><p class="muted">Assumes all items use the same tax rate. Actual checkout tax may vary.</p></section><section class="panel"><div class="head"><strong id="count">Items (0)</strong><button class="btn danger" id="clear" type="button">Clear cart</button></div><div id="items"></div></section></main><script>const $=id=>document.getElementById(id),key='cart-tally-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{items:[],rate:'7',budget:''}}catch{state={items:[],rate:'7',budget:''}}const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);$('rate').value=state.rate;$('budget').value=state.budget;function render(){let sub=Math.round(state.items.reduce((a,b)=>a+b,0)*100)/100, tax=Math.round(sub*(Number(state.rate)||0))/100, total=sub+tax;$('subtotal').textContent=money(sub);$('taxAmount').textContent=money(tax);$('total').textContent=money(total);$('count').textContent=`Items (${state.items.length})`;$('remaining').textContent=state.budget!==''?`Budget remaining: ${money(Number(state.budget)-total)}`:'';$('items').replaceChildren(...state.items.map((p,i)=>{let row=document.createElement('div');row.className='item';let label=document.createElement('span');label.textContent=`Item ${i+1} · ${money(p)}`;let btn=document.createElement('button');btn.className='remove';btn.type='button';btn.setAttribute('aria-label',`Remove item ${i+1}`);btn.textContent='×';btn.onclick=()=>{state.items.splice(i,1);save()};row.append(label,btn);return row}));}function save(){localStorage.setItem(key,JSON.stringify(state));render()}$('addForm').onsubmit=e=>{e.preventDefault();let p=Number($('price').value);if(!Number.isFinite(p)||p<=0)return;state.items.push(Math.round(p*100)/100);$('price').value='';save();$('price').focus()};$('rate').oninput=e=>{state.rate=e.target.value;save()};$('budget').oninput=e=>{state.budget=e.target.value;save()};$('clear').onclick=()=>{if(state.items.length&&confirm('Clear all items?')){state.items=[];save()}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
